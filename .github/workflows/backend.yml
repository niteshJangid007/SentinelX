name: Backend tests and security regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinelx
          POSTGRES_DB: sentinelx_test
          POSTGRES_PASSWORD: ci-only-for-tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinelx -d sentinelx_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://sentinelx:ci-only-for-tests@127.0.0.1:5432/sentinelx_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff format --check app scripts tests
      - run: python -m ruff check app scripts tests
      - run: bash scripts/check.sh
        env:
          PYTHON_BIN: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results/*.xml
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinelx
          POSTGRES_DB: sentinelx_test
          POSTGRES_PASSWORD: ci-only-for-tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinelx -d sentinelx_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://sentinelx:ci-only-for-tests@127.0.0.1:5432/sentinelx_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: Dashboard acceptance and security checks
        env:
          SECUREFLOW_DB: ${{ runner.temp }}/secureflow-browser.db
          SECUREFLOW_TEST_BASE_URL: http://127.0.0.1:8001
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 --no-proxy-headers > /tmp/secureflow-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(100):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=1).close()
                  break
              except OSError:
                  time.sleep(.1)
          else:
              raise RuntimeError('Browser test server failed to start')
          PY
          python scripts/browser_test.py
      - run: python scripts/check_admin_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-screenshots
          path: docs/screenshots/*.png
