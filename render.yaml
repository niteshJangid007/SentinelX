# Deployment blueprint only. Review hosting charges and settings before applying.
services:
  - type: web
    name: sentinelx
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    numInstances: 1
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinelx-postgres
          property: connectionString
      - key: SENTINELX_ENV
        value: production
      - key: SECUREFLOW_COOKIE_SECURE
        value: "true"
      - key: SECUREFLOW_PUBLIC_ORIGIN
        sync: false
      - key: PORT
        value: "8000"
databases:
  - name: sentinelx-postgres
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: sentinelx
    user: sentinelx
    ipAllowList: []
